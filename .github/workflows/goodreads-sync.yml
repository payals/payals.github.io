name: Sync reading list from Goodreads

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: goodreads-sync

jobs:
  sync:
    if: github.repository == 'payals/payals.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # sync_goodreads.py exits non-zero on any malformed feed or a read-list
      # shrink past the safety valve (see data/books.README.md); that failure
      # stops the job here, before the commit step, so a bad feed never
      # publishes a partial or empty result.
      - name: Sync Goodreads shelves
        env:
          GOODREADS_RSS_KEY: ${{ secrets.GOODREADS_RSS_KEY }}
        run: python3 scripts/sync_goodreads.py --user-id "${{ vars.GOODREADS_USER_ID }}"

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/books.json data/now.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/books.json data/now.json
            git commit -m "Sync reading list from Goodreads"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          else
            echo "no changes to commit"
          fi
