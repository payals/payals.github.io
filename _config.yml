title: Payal Singh
description: Notes on Postgres, AI, and systems engineering.
# Positioning line; the home page's role line is its first sentence, upper-cased.
tagline: "staff platform engineer. Postgres, data systems, DevOps, and AI-native systems."
url: "https://payalsingh.me"
baseurl: ""
lang: en
author: Payal Singh
email: psinghpayal@outlook.com
source_url: https://github.com/payals/payals.github.io

# github-pages would otherwise inject jekyll-theme-primer (assets/css/style.css).
theme: null

# Contact and elsewhere links for the command layout (/, /talks/, /cv/).
# Email comes from `email` above. One list here, rendered by Liquid, so a new
# profile link is one edit.
profile_links:
  contact:
    - label: LinkedIn
      url: https://linkedin.com/in/payalsingh
    - label: GitHub
      url: https://github.com/payals
  elsewhere:
    - label: Codeberg
      url: https://codeberg.org/sillygoose
    - label: Medium
      url: https://medium.com/@reliable-by-design
    - label: Older blog
      url: https://penningpence.blogspot.com
    - label: Reading
      url: /reading/
    - label: RSS
      url: /feed.xml

# Read data/*.json directly so site.data and the public /data/*.json URLs share one file.
data_dir: data

permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
markdown_ext: "markdown"
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  categories:
    - postgres

# Every page renders through _layouts/command.html. These defaults set the
# command layout's section, kind and path where a page's own front matter
# should not change: the evidence bundles are published as-is (c_kind doc:
# wide tables, prompt path from the URL), and /reading/ sits under Now.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "evidence"
    values:
      c_kind: doc
      c_section: writing
  - scope:
      path: "reading.markdown"
    values:
      c_section: now
      c_path: reading

exclude:
  - _talk-evidence/
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - scripts/
  - vendor/
  - .bundle/
  - .venv/
  - .omc/
  - .playwright-mcp/
  - .env
  - .env.example
  - napkin.md
  - drafts/
  - CLAUDE.md
  - AGENTS.md
