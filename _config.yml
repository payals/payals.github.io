title: Payal Singh
description: Notes on Postgres, AI, and systems engineering.
# Topbar positioning line on every page; rendered after the name, so it starts lowercase.
tagline: "staff platform engineer. Postgres, data systems, DevOps, and AI-native systems."
url: "https://payalsingh.me"
baseurl: ""
lang: en
author: Payal Singh
email: psinghpayal@outlook.com
source_url: https://github.com/payals/payals.github.io

# github-pages would otherwise inject jekyll-theme-primer (assets/css/style.css).
theme: null

# BUDGET (phase3.md arbitration table): assets/css/features.scss compiles to
# assets/css/features.css. Compressed output is what keeps the landing
# transfer under the 150KB gzipped cap.
sass:
  style: compressed

# Read data/*.json directly so site.data and the public /data/*.json URLs share one file.
data_dir: data

permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
markdown_ext: "markdown"
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  categories:
    - postgres

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - _talk-evidence/
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - scripts/
  - vendor/
  - .bundle/
  - .venv/
  - .omc/
  - .playwright-mcp/
  - .env
  - .env.example
  - napkin.md
  - drafts/
  - CLAUDE.md
  - AGENTS.md
